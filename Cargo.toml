[package]
name = "ms2rescore-rs"
version = "0.4.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ms2rescore_rs"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
mzdata = { version = "0.61.0", features = ["thermo"] }
pyo3 = { version = "0.27.0", features = ["anyhow"] }
timsrust = "0.4.1"
